spring.application.name=jclaw
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen3:8b
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.num-ctx=8192

server.port=8080

spring.datasource.url=jdbc:h2:file:./data/jclaw
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always

jclaw.agent.max-iterations=8
jclaw.agent.max-history-messages=10
jclaw.agent.plugins.dir=./plugins

# MCP-Server (Deny-by-Default): erst mit enabled=true werden die Tools registriert.
jclaw.mcp.enabled=false
# jclaw.mcp.request-timeout=60s
# jclaw.mcp.servers.filesystem.url=http://localhost:8080
# jclaw.mcp.servers.linter.command=npx
# jclaw.mcp.servers.linter.args=-y, @modelcontextprotocol/server-everything

# Web-Werkzeuge (Deny-by-Default): web_fetch (nur erlaubte Domains) + web_search.
jclaw.agent.webtool.enabled=false
# jclaw.agent.webtool.allowed-domains=example.com, docs.spring.io
# jclaw.agent.webtool.search-endpoint=https://api.duckduckgo.com
# jclaw.agent.webtool.fetch-timeout-seconds=10
# jclaw.agent.webtool.max-fetch-bytes=200000
# jclaw.agent.webtool.max-search-results=5

# Tool-Policies (Deny-by-Default): allow = nur diese Tools aktiv, deny = diese sperren (Deny schlägt Allow).
# jclaw.agent.tools.allow=readFile,glob,writeFile
# jclaw.agent.tools.deny=runCommand
