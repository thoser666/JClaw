name: SonarCloud analysis

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze with SonarCloud (Maven Way)
        # Laeuft erst, wenn das SONAR_TOKEN-Repo-Secret gesetzt ist
        # (https://sonarcloud.io/account/security/)
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Projekt-/Organisations-Key in den D-Werten an die eigene SonarCloud anpassen
        run: mvn clean compile sonar:sonar -Dsonar.projectKey=thoser666_JClaw -Dsonar.organization=thoser666 -DskipTests
