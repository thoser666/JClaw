name: "CodeQL Analysis"

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Zwingend JDK 25 bereitstellen, damit der Compiler die neuen Java-Features versteht
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # 2. CodeQL für Java initialisieren
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.matrix.language }}

      # 3. Manueller Build statt unzuverlässigem Autobuild
      - name: Build Java Application
        run: |
          mvn clean compile -DskipTests

      # 4. Analyse ausführen
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4